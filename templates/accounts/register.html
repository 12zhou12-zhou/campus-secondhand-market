{% extends "base.html" %}
{% block title %}注册 - 校园闲置物品交易平台{% endblock %}
{% block content %}
<div class="card" style="max-width:520px;margin:0 auto">
  <h2>注册账号</h2>
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
      <label>{{ field.label }}</label>
      {{ field }}
      {% if field.errors %}<div class="msg error">{{ field.errors|join:"；" }}</div>{% endif %}
    {% endfor %}
    <p class="muted">管理员账号不开放注册；提交后需等待管理员审核。</p>
    <button type="submit">注册</button>
  </form>
</div>
{% endblock %}
